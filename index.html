<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0C0E">
<title>ECHO//RIFT</title>
<link rel="stylesheet" href="hud.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<!-- Versão do Babylon fixada aqui. Se a primeira não carregar, tenta a 9.29.0. O painel mostra a versão que rodou. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/9.35.0/babylon.js"></script>
<script>window.BABYLON||document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/babylonjs/9.29.0/babylon.js"><\/script>')</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"></div>
<script type="module">
// Entrada: o menu abre primeiro e PLAY carrega o jogo (app-boot.js, sem alterações).
// index.html?jogo pula o menu. Se o menu falhar, o jogo abre direto.
const GAME_V = 1; // aumente a cada versão nova: o APK compara esse número e avisa da atualização
const boot = () => import('./app-boot.js');
if (new URLSearchParams(location.search).has('jogo')) boot();
else import('./ui-menu.js')
  .then((m) => m.showMenu({ version: GAME_V, onStart: () => (window.BABYLON ? boot() : Promise.reject(new Error('O Babylon não carregou. Confira a conexão.'))) }))
  .catch((e) => { // o menu falhou: o jogo abre direto, mas o aviso vermelho mostra o motivo
    console.error(e); const r = document.getElementById('mn'); if (r) r.remove();
    const m = document.createElement('div'); m.textContent = 'Menu não carregou (' + ((e && e.message) || e) + '). Abrindo o jogo direto.';
    m.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:200;padding:10px 14px;background:#C4452D;color:#fff;font:600 13px system-ui,sans-serif;text-align:center;pointer-events:none';
    document.body.append(m); setTimeout(() => m.remove(), 12000); boot();
  });
</script>
</body>
</html>
